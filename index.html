<!DOCTYPE html>

<html>

<head>
    <link rel="stylesheet" href="./CSS/style.css" type="text/css">
    <link rel="stylesheet" href="./CSS/buttons.css" type="text/css">
    <link rel="stylesheet" href="./CSS/misc-style.css" type="text/css">
    <link href="dist/pattern.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=MuseoModerno:ital,wght@0,100..900;1,100..900&family=Stack+Sans+Notch:wght@200..700&family=Syne:wght@400..800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="timeline-wrapper">
        <div id="particles-js"></div>
        <div id="blur-layer"></div>
        <div id="patern-layer" class="pattern-cross-dots-xl"></div>
        <div class="timeline unselectable" id="timeline">
            <div class="event">
                <span class="year">13,800,000,000 BCE</span>
                <span class="label">It all begins...</span>
            </div>
        </div>
    </div>

    <div class="info-panel glass-card">
        <div class="info-panel-sidebar">
            <div class="info-panel-sidebar-quick-action-wrapper">
                <div class="group info-panel-search-bar">
                    <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
                        <g>
                        <path
                            d="M21.53 20.47l-3.66-3.66C19.195 15.24 20 13.214 20 11c0-4.97-4.03-9-9-9s-9 4.03-9 9 4.03 9 9 9c2.215 0 4.24-.804 5.808-2.13l3.66 3.66c.147.146.34.22.53.22s.385-.073.53-.22c.295-.293.295-.767.002-1.06zM3.5 11c0-4.135 3.365-7.5 7.5-7.5s7.5 3.365 7.5 7.5-3.365 7.5-7.5 7.5-7.5-3.365-7.5-7.5z"
                        ></path>
                        </g>
                    </svg>

                    <input
                        id="info-panel-search-bar-input"
                        class="input info-panel-search-bar-input"
                        type="search"
                        placeholder="Search..."
                        name="searchbar"
                    />
                </div>
                <div class="info-panel-sidebar-burger-quick-action">
                    <label class="burger" for="burger">
                        <input type="checkbox" id="burger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </label>
                </div>
                
            </div>
            
            <div class="info-panel-shortcut-wrapper">
                <div class="info-panel-shortcut">
                    <button class="btn-28 info-panel-shortcut-button">Test Button 1</button>
                </div>
                <div class="info-panel-shortcut">
                    <button class="btn-28 info-panel-shortcut-button">Test Button 2</button>
                </div>
            </div>
        </div>
        <div class="info-panel-articles-wrapper">
            <div class="info-panel-article">
                <div class="article-title-wrapper" id="article-title-wrapper">
                    <h1 class="article-title" id="article-title">Loading...</h1>
                </div>
                <div class="article-header-image" id="article-header-image">

                </div>
                <div class="article-description-wrapper" id="article-description-wrapper">
                    <span class="article-description" id="article-description">Loading...</span>
                </div>
                <div class="article-links-wrapper" id="article-links-wrapper">
                    
                </div>
                <div class="article-author-wrapper" id="article-author-wrapper">
                    <span class="article-author" id="article-author">Person</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="./JS/script.js" type="module"></script>
</body>

</html>
